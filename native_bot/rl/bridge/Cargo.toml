[package]
name = "akagi-rl-bridge"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "_akagi_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
native_bot = { path = "../..", default-features = false }
riichienv-core = "=0.4.8"
pyo3 = { version = "0.28", features = ["extension-module"] }
serde_json = "1"

[package.metadata.maturin]
name = "akagi-rl-bridge"
